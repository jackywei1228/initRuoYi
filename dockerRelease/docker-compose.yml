version: "3.8"

services:
  ruoyimysql:
    image: mysql:8.0
    container_name: ruoyi-mysql-base
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ry-vue
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ruoyimysql-data:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d
      - ../sql:/repo-sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  ruoyiredis:
    image: redis:7-alpine
    container_name: ruoyi-redis-base
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  ruoyibackend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ruoyi-backend
    depends_on:
      ruoyimysql:
        condition: service_healthy
      ruoyiredis:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config
      - ./upload:/data/ruoyi/uploadPath
    environment:
      TZ: Asia/Shanghai

volumes:
  ruoyimysql-data:
