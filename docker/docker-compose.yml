version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: ruoyi-mysql-dev
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ry-vue
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    restart: unless-stopped

volumes:
  mysql-data: